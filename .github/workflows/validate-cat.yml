name: Validate CAT

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: validate-cat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAT_ROOT_HYGIENE_MODE: warn
      CAT_HYGIENE_KILL_SWITCH: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python scripts/cat_check_repo.py
      - run: python scripts/cat_root_hygiene_strict.py
      - name: Install and initialize official Beads
        run: |
          npm install --global @beads/bd@1.1.2
          echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
          export PATH="$(npm prefix --global)/bin:$PATH"
          python scripts/cat_beads_init.py
          bd --version
          bd prime
          bd ready --json
      - run: python scripts/cat_resolve_go.py
      - run: pytest -q
