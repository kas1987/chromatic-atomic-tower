name: CAT Governance CI

on:
  pull_request:
  push:
    branches:
      - master
      - mp-cat-*

permissions:
  contents: read

concurrency:
  group: cat-governance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CAT governance and Harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CAT repo health
        run: python scripts/cat_check_repo.py

      - name: CAT schema validation
        run: python scripts/cat_validate.py --all

      - name: CAT mission and BEAD alignment validation
        run: python scripts/cat_align_check.py --strict

      - name: Mermaid validation
        run: python scripts/cat_validate_mermaid.py --root .

      - name: Targeted governance contracts
        run: python -m pytest tests/test_ci_governance.py tests/test_harness_bridge.py -q

      - name: Generate evidence bundle skeleton
        if: always()
        run: python scripts/cat_generate_evidence_bundle.py --root .

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cat-governance-evidence
          path: evidence/
          retention-days: 14
