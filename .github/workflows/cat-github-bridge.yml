name: CAT GitHub Bridge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cat-github-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CAT validation
        run: |
          python scripts/cat_validate.py --all
          python -m pytest tests/test_git_bridge.py tests/test_harness_bridge.py -q
      - name: GitHub Bridge sample validation
        run: |
          python scripts/cat_git_bridge.py validate-pr \
            --title "[MP-CAT-A022-4C01][BEAD-CAT-A022-4C01-01] Define deterministic cost-guard tiers" \
            --branch codex/cat-a022-cost-guard-tiers \
            --commit-message "[MP-CAT-A022-4C01][BEAD-CAT-A022-4C01-01] Define deterministic cost-guard tiers" \
            --bead beads/completed/BEAD-CAT-A022-4C01-01.yaml \
            --changed-files tests/fixtures/github/changed_files_allowed.txt \
            --write-report
