name: CAT GitHub Bridge

on:
  pull_request:
  workflow_dispatch:

jobs:
  github-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CAT validation
        run: |
          python scripts/cat_validate.py --all
          python -m pytest -q tests
      - name: GitHub Bridge sample validation
        run: |
          python scripts/cat_git_bridge.py validate-pr \
            --title "[MP-CAT-EXAMPLE-001][cat-example-1] Validate Wisker contract" \
            --branch codex/cat-beads-wiskers-cutover \
            --commit-message "[MP-CAT-EXAMPLE-001][cat-example-1] Validate Wisker contract" \
            --bead wiskers/examples/WISKER-EXAMPLE-001.yaml \
            --changed-files tests/fixtures/github/wisker_changed_files_allowed.txt \
            --write-report
