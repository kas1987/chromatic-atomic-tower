  objective_clarity: 97
  scope_clarity: 96
  evidence_quality: 93
  reversibility: 98
  tool_fit: 94
  risk_awareness: 99
  testability: 95
risk_level: high
reversibility: high
stop_conditions:
- A route decision would mutate state or invoke self-healing.
- Human approval is inferred from an agent review or model output.
- Current lifecycle state cannot be distinguished from taxonomy classification.
- Exact observed and artifact HEADs cannot both be recorded.
- Duplicate events cannot be deterministically identified.
- A forbidden path, remote mutation, or provider configuration appears.
- Confidence drops below 90.
definition_of_done:
- route_decision.schema.json requires subject type, expected revision, observed HEAD,
  policy digests, normalized classification, constraints, outcome, and evidence binding.
- lifecycle_event.schema.json requires event ID, idempotency key, prior revision,
  applied outcome, policy digest, HEAD, and evidence references.
- ROUTE_DECISION_POLICY.yaml permits only allow_plan, require_human, or block and
  only none/dry_run effects.
- Matrix tests assert stable fail-closed outcomes for stale HEAD, malformed output,
  exhausted budget, provider outage, conflicting fields, dependency cycle, duplicate
  delivery, and policy drift.
- Duplicate delivery returns the original decision without mutation in the contract
  fixture model.
- No runtime transition, self-healing, provider, model, mission, BEAD, or remote settings
  are changed.
- Evidence records observed_head_sha and artifact_head_sha separately.
validation:
- type: test
  command: python -m pytest tests/test_cat_route_matrix.py -q
  evidence_path: evidence/reports/routing/BEAD-CAT-A023-4C01-06.md
  required: true
- type: command
  command: python scripts/cat_check_repo.py && python scripts/cat_validate.py --all
  evidence_path: evidence/reports/routing/BEAD-CAT-A023-4C01-06.md
  required: true
required_output:
