stop_conditions:
- Need to touch file outside allowed_paths.
- Need secret or credential.
- Confidence drops below minimum.
- Validation cannot be run.
definition_of_done:
- ANNA root contract, README, license, ignore rules, and tree map exist.
- Project boundary schema and offline boundary checker exist.
- Contract tests reject forbidden private roots and pass synthetic fixtures.
- CI invokes the offline contract gate without credentials or network dependency.
- Evidence records changed paths, validation results, and residuals.
validation:
- type: self_review
  command: "python -m pytest -q tests/test_repo_contract.py"
  evidence_path: evidence/reports/MP-CAT-A017-4C01-01_contract.md
  required: true
- type: boundary_check
  command: "python tools/anna_public_boundary.py --check"
  evidence_path: evidence/reports/MP-CAT-A017-4C01-01_boundary.json
  required: true
required_output:
- summary
- files_changed
- validation_result
- evidence_path
handoff:
