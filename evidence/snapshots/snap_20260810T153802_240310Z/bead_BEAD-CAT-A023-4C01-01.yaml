mission_id: MP-CAT-A023-4C01
title: Define canonical CAT identity, urgency, and migration contract
status: reviewed
priority: 1
agent_role: Cartographer
autonomy_level: L2
objective: Inventory every live CAT identity grammar and define a versioned machine-readable
  taxonomy contract that separates immutable IDs, urgency, severity, complexity, risk,
  reversibility, HITL, and external relations.
allowed_paths:
- gates/CAT_ID_TAXONOMY.yaml
- docs/operations/CAT_ID_NAMING_CONVENTION.md
- evidence/reports/taxonomy/BEAD-CAT-A023-4C01-01.md
- evidence/reports/taxonomy/BEAD-CAT-A023-4C01-01.json
- learnings/DECISION_LOG.md
forbidden_paths:
- .env
- .env.*
- secrets/**
- credentials/**
- '**/*.key'
- agents/registry/AGENT_SCORECARD.yaml
- .git/hooks/**
- missions/**
- beads/**
- GitHub branch protection, secrets, PRs, branches, or repository settings
dependencies:
- MP-CAT-A022-4C01
tool_budget:
  search: 30
  read: 80
  write: 12
  execute: 20
  max_runtime_minutes: 120
confidence:
  minimum: 90
  current: 94
  objective_clarity: 96
  scope_clarity: 94
  evidence_quality: 92
  reversibility: 96
  tool_fit: 94
  risk_awareness: 97
  testability: 92
risk_level: high
reversibility: high
stop_conditions:
- A canonical writer cannot be identified for an identity fact.
- Historical identifiers would need to be renamed.
- A forbidden path, secret, credential, or remote mutation appears.
- Confidence drops below 90.
definition_of_done:
- All live ID grammar and semantic consumers are inventoried with file references.
- gates/CAT_ID_TAXONOMY.yaml defines version, forms, token semantics, relations, and
  legacy compatibility.
- Priority is the only urgency axis and documents the existing 1-5 to P0-P4 compatibility
  map.
- Severity, complexity, risk, reversibility, and HITL are explicit separate fields
  with routing roles.
- S/A/B/C is defined as non-routing mission-class metadata; no agent may infer urgency
  or HITL from it.
- The naming document is updated as a thin human-readable projection of the contract.
- A non-renaming migration map and exact-head evidence report are recorded.
