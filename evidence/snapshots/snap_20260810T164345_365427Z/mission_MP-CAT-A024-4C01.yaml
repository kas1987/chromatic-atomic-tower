acceptance_criteria:
- The A023 baseline is reproducible and bound to an immutable HEAD.
- 'Every residual finding has one of three explicit dispositions: repaired, compatibility,
  or accepted with owner and rationale.'
- Historical identifiers remain unchanged and remain joinable across mission, BEAD,
  PR, branch, dependency, and evidence relations.
- The audit has no unexplained errors after the repair slices; permitted compatibility
  findings remain machine-readable.
- Repaired finding classes have task-relative regression tests and deterministic output.
- Two consecutive clean audit runs show no unexplained taxonomy drift.
- Final evidence binds to the final immutable HEAD and leaves the tower in a reconciled
  terminal state.
success_metrics:
- Reduce the A023 baseline of 133 errors to zero unexplained errors.
- Preserve or explicitly document all 36 compatibility exceptions.
- Zero newly introduced canonical identity mismatches during the mission.
- No remote or secret-bearing mutation.
required_validation:
- type: command
  command: python scripts/cat_taxonomy_audit.py --json && python scripts/cat_check_repo.py
    && python scripts/cat_validate.py --all
  evidence_path: evidence/reports/taxonomy/MP-CAT-A024-4C01_validation.md
  required: true
- type: test
  command: python -m pytest tests/test_cat_taxonomy.py tests/test_cat_align_missionid.py
    -q
  evidence_path: evidence/reports/taxonomy/MP-CAT-A024-4C01_tests.md
  required: true
rollback:
  required: true
  plan: Revert only the individual metadata, consumer, and evidence-reference repairs
    while retaining the baseline and disposition register; never rename historical
    identifiers.
human_gate:
  required: true
  approver: Human Owner
tool_budget:
  search: 60
  read: 160
  write: 100
  execute: 80
  max_runtime_minutes: 360
evidence_requirements:
- Immutable A023 baseline and A024 disposition register.
- Per-slice before/after audit JSON and task-relative tests.
- Compatibility matrix with owner and rationale for every retained exception.
- Exact-head final report and generated evidence bundle.
notes:
- A024 is a remediation mission, not a taxonomy-v3 redesign.
- The current compact ID remains an immutable join key; no identifier renaming is
  permitted.
- A024 starts in draft after ANA registration. Human approval and GO are separate
  execution gates.
stop_conditions:
- A residual cannot be classified without changing an immutable identifier.
- A repair would alter routing, priority, severity, risk, autonomy, or provider policy
  outside this mission.
- A forbidden path or remote mutation appears.
- Exact-head evidence cannot be produced.
- Confidence falls below 90.
