objective: Remediate and explain the historical taxonomy drift recorded by A023 while
  preserving immutable identifiers and leaving CAT with a reviewable, reproducible
  cross-file identity baseline.
background: A023 established the canonical taxonomy contract and read-only audit,
  but its closeout preserved 133 residual audit errors, 36 compatibility exceptions,
  and one expected example-only pending path. A024 converts that measured debt into
  a bounded remediation queue instead of silently rewriting historical identifiers.
scope:
  in:
  - Reproduce the A023 residual audit at an exact immutable HEAD.
  - Classify each residual as repairable drift, documented compatibility, or accepted
    historical debt.
  - Repair authoritative mission and BEAD metadata, relations, and evidence references
    where safe.
  - Reconcile taxonomy-consuming gates, validators, templates, and documentation only
    where the audit identifies drift.
  - Add regression coverage for every repaired finding class and publish before/after
    metrics.
  - Produce a final exact-head debt register and follow-up list for any residual that
    requires a separate human decision.
  out:
  - Renaming historical mission, BEAD, PR, branch, or evidence identifiers.
  - Changing priority, severity, risk, autonomy, model routing, or provider-plan policy
    without a separate approved mission.
  - Remote GitHub, MCP, secret, credential, production, branch, or merge mutations.
  - Broad repository cleanup unrelated to the A023 taxonomy findings.
  - Replacing the canonical taxonomy contract or creating a second identity writer.
