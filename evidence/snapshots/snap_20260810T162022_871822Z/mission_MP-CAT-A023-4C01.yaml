objective: Establish one versioned machine-readable CAT identity taxonomy, reconcile
  its validators and documentation, and prevent semantic drift without renaming historical
  mission or BEAD identifiers.
background: The current compact IDs are useful join keys, but their meanings are duplicated
  across Markdown, YAML gates, scripts, schemas, and routing documentation. The audit
  found legacy/new regex divergence, partially populated derived fields, priority-tier
  mismatches, and complexity values that disagree with mission levels. A canonical
  contract is needed before further missions or adapters are added.
scope:
  in:
  - Define the immutable identity grammar and explicit semantic field map.
  - Make priority the sole urgency axis, with an explicit P0-P4 compatibility map
    for existing 1-5 values.
  - Keep severity, complexity, risk, reversibility, and HITL as distinct routing and
    review inputs.
  - Treat S/A/B/C as descriptive mission-class metadata, never as an urgency or routing
    override.
  - Separate mission identity from PR, branch, status, dependency, and evidence relations.
  - Reconcile validators, generators, gates, templates, and documentation to one contract.
  - Add cross-file asymmetry and derived-identity drift checks.
  - Record legacy compatibility and a non-renaming migration map.
  out:
  - Renaming or rewriting historical mission, BEAD, PR, branch, or evidence identifiers.
  - Changing legacy mission priority values, risk, autonomy, model routing, or provider
    plans.
  - Using mission class or compact-ID tokens as a substitute for explicit routing
    fields.
  - Remote GitHub settings, PR, branch, secret, MCP, or production mutations.
  - Adding a second canonical writer for mission state or registry state.
