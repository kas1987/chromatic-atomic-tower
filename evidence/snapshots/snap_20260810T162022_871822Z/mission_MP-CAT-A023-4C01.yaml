evidence_requirements:
- canonical taxonomy YAML with version and token semantics
- inventory of all regex, generator, schema, template, and documentation consumers
- legacy compatibility matrix and non-renaming migration map
- cross-file asymmetry test output
- exact-head final validation and closeout report
notes:
- A023 registration uses the current MP-CAT-A022-4C01 convention; taxonomy v2 may
  propose a clearer future format but must not rewrite existing IDs.
- The compact ID is an immutable join key; PR numbers, branches, HEAD SHAs, status,
  and dependencies remain separate relations.
- 'For this mission, priority: 1 remains the existing highest queue value. BEAD-01
  must define its unambiguous P0-P4 compatibility display before any consumer change.'
- 'mission_class: A is descriptive metadata only. It must not affect dispatch, model
  selection, HITL, or promotion gates.'
stop_conditions:
- A change requires a forbidden path or remote mutation.
- The canonical writer for a mutable fact cannot be identified.
- Legacy compatibility cannot be preserved without mass ID renaming.
- A taxonomy meaning remains ambiguous after evidence review.
- Confidence falls below 90.
