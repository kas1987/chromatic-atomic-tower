acceptance_criteria:
- One versioned machine-readable taxonomy contract defines all supported ID forms
  and token semantics.
- Priority is the sole urgency axis; the contract maps legacy numeric priority to
  a P0-P4 display without ambiguity.
- Severity, complexity, risk, reversibility, and HITL are separately defined and tested
  as non-interchangeable fields.
- Mission class is explicitly non-routing metadata unless a future human-approved
  policy changes that rule.
- Historical IDs remain valid through an explicit compatibility policy and are not
  renamed.
- Validators and generators derive their grammar from the canonical contract or prove
  synchronized adapters.
- Mission, BEAD, PR, branch, dependency, and evidence relations are explicit and mechanically
  joinable.
- Cross-file asymmetry checks detect stale IDs, duplicate writers, mismatched complexity,
  and missing relations.
- The full CAT validation suite passes with a reviewable taxonomy evidence report.
success_metrics:
- Zero unexplained taxonomy regex or documentation discrepancies.
- Zero new missions with missing required identity fields.
- Historical compatibility remains green without mass file rewrites.
