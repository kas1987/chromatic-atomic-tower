definition_of_done:
- The action schema requires dry_run=true and human_gate=true.
- The planner accepts only a finite action vocabulary and synthetic target classes.
- Unsafe paths, shell syntax, commands, network URLs, and non-dry-run requests are
  rejected.
- Valid requests produce deterministic observe-only plans without filesystem, subprocess,
  or network I/O.
- Synthetic tests and public-boundary checks pass.
