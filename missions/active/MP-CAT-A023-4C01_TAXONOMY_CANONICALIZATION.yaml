acceptance_criteria:
- 'One versioned machine-readable taxonomy contract defines all supported ID forms and token semantics.'
- 'Historical IDs remain valid through an explicit compatibility policy and are not renamed.'
- 'Validators and generators derive their grammar from the canonical contract or prove synchronized adapters.'
- 'Mission, BEAD, PR, branch, dependency, and evidence relations are explicit and mechanically joinable.'
- 'Cross-file asymmetry checks detect stale IDs, duplicate writers, mismatched complexity, and missing relations.'
- 'The full CAT validation suite passes with a reviewable taxonomy evidence report.'
success_metrics:
- 'Zero unexplained taxonomy regex or documentation discrepancies.'
- 'Zero new missions with missing required identity fields.'
- 'Historical compatibility remains green without mass file rewrites.'
required_validation:
- type: local
  command: python scripts/cat_check_repo.py && python scripts/cat_validate.py --all
  evidence_path: evidence/reports/taxonomy/MP-CAT-A023-4C01_validation.md
  required: true
- type: test
  command: python -m pytest tests/test_cat_taxonomy.py tests/test_cat_align_missionid.py -q
  evidence_path: evidence/reports/taxonomy/MP-CAT-A023-4C01_tests.md
  required: true
rollback:
  required: true
  plan: 'Restore the pre-taxonomy contract and adapters while retaining the audit report and compatibility map.'
human_gate:
  required: true
  approver: Human Owner
tool_budget:
  search: 50
  read: 140
  write: 100
  execute: 80
  max_runtime_minutes: 360
evidence_requirements:
- canonical taxonomy YAML with version and token semantics
- inventory of all regex, generator, schema, template, and documentation consumers
- legacy compatibility matrix and non-renaming migration map
- cross-file asymmetry test output
- exact-head final validation and closeout report
notes:
- 'A023 registration uses the current MP-CAT-A022-4C01 convention; taxonomy v2 may propose a clearer future format but must not rewrite existing IDs.'
- 'The compact ID is an immutable join key; PR numbers, branches, HEAD SHAs, status, and dependencies remain separate relations.'
stop_conditions:
- 'A change requires a forbidden path or remote mutation.'
- 'The canonical writer for a mutable fact cannot be identified.'
- 'Legacy compatibility cannot be preserved without mass ID renaming.'
- 'A taxonomy meaning remains ambiguous after evidence review.'
- 'Confidence falls below 90.'
