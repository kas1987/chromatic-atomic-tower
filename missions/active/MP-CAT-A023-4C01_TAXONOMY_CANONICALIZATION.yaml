mission_id: MP-CAT-A023-4C01
title: CAT Taxonomy v2 Canonicalization and Identity Drift Control
level: M4
status: approved
owner: Human Owner
priority: 1
priority_tier: A
complexity_order: 4C01
risk_level: high
reversibility: high
autonomy_level: L2
confidence_minimum: 90
created: '2026-08-10'
last_updated: '2026-08-10T14:36:00+00:00'
objective: >-
  Establish one versioned machine-readable CAT identity taxonomy, reconcile its
  validators and documentation, and prevent semantic drift without renaming
  historical mission or BEAD identifiers.
background: >-
  The current compact IDs are useful join keys, but their meanings are duplicated
  across Markdown, YAML gates, scripts, schemas, and routing documentation. The
  audit found legacy/new regex divergence, partially populated derived fields,
  priority-tier mismatches, and complexity values that disagree with mission
  levels. A canonical contract is needed before further missions or adapters are
  added.
scope:
  in:
  - 'Define the immutable identity grammar and explicit semantic field map.'
  - 'Separate mission identity from PR, branch, status, dependency, and evidence relations.'
  - 'Reconcile validators, generators, gates, templates, and documentation to one contract.'
  - 'Add cross-file asymmetry and derived-identity drift checks.'
  - 'Record legacy compatibility and a non-renaming migration map.'
  out:
  - 'Renaming or rewriting historical mission, BEAD, PR, branch, or evidence identifiers.'
  - 'Changing mission priority, risk, autonomy, model routing, or provider plans.'
  - 'Remote GitHub settings, PR, branch, secret, MCP, or production mutations.'
  - 'Adding a second canonical writer for mission state or registry state.'
