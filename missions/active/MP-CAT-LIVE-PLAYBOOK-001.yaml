mission_id: MP-CAT-LIVE-PLAYBOOK-001
title: CAT Live Operations Playbook
level: M2
status: approved
owner: Human Owner
priority: 1
risk_level: low
reversibility: high
autonomy_level: L2
confidence_minimum: 80
created: '2026-08-15'
last_updated: '2026-08-15'
objective: >-
  Establish the first usable operating playbook for the live official
  Beads-to-Wiskers CAT lifecycle.
background: >-
  CAT has completed its official Beads and Wiskers cutover; this bounded
  mission proves the production workflow end to end.
scope:
  in:
    - Create the CAT live operations playbook.
    - Generate and validate one Wisker from official Bead cat-20i.
    - Produce evidence and complete official Bead closeout.
  out:
    - Changes to CAT runtime code or global agent configuration.
allowed_paths:
  - playbooks/CAT_LIVE_OPERATIONS_PLAYBOOK.md
  - wiskers/packets/**
  - evidence/bundles/generated/**
  - evidence/reports/**
  - evidence/logs/**
forbidden_paths:
  - .beads/**
  - .git/**
  - archive/**
  - .env
  - '*.pem'
dependencies: []
acceptance_criteria:
  - Codex and Cursor can follow the same documented lifecycle.
  - The Wisker contains the official Bead digest and source commit SHA.
  - Evidence validates before the official Bead is closed.
required_validation:
  - type: repo
    command: python scripts/cat_check_repo.py
    evidence_path: evidence/logs/cat_live_playbook_validation.log
    required: true
  - type: cat
    command: python scripts/cat_validate.py --all
    evidence_path: evidence/logs/cat_live_playbook_validation.log
    required: true
  - type: tests
    command: pytest -q
    evidence_path: evidence/logs/cat_live_playbook_validation.log
    required: true
rollback:
  required: true
  plan: Remove the playbook and derived evidence, then restore the archived CAT baseline.
human_gate:
  required: false
  approver: Human Owner
tool_budget:
  search: 12
  read: 20
  write: 8
  execute: 12
  max_runtime_minutes: 30
beads:
  - id: cat-20i
    authority: official_beads
evidence_requirements:
  - wisker_packet
  - validation_output
  - closeout_report
