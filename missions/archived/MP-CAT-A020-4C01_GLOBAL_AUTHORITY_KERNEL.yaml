evidence_requirements:
- authority matrix and contract
- machine-readable schema validation
- cross-repo boundary proof
- rollback record
- CAT validation output
stop_conditions:
- A019 is not closed with evidence.
- Any authority fact has two canonical writers.
- V2 implementation details must be copied into CAT to proceed.
- Cross-repo mutation cannot be bounded to explicit paths and evidence.
