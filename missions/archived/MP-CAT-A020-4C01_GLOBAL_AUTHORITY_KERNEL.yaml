acceptance_criteria:
- Every mutable governance fact has one canonical writer.
- CAT can govern a V2 execution request without granting V2 global state authority.
- Project adapters cannot overwrite CAT mission registry state.
- Cross-repo mutation requires Mission ID, BEAD ID, allowed paths, validation, and
  evidence.
- Contract tests cover unauthorized write rejection and authorized execution evidence.
required_validation:
- type: cat_validate
  command: python scripts/cat_validate.py --all
  evidence_path: evidence/reports/MP-CAT-A020_validate.txt
  required: true
rollback:
  required: true
  plan: Revert A020 authority-contract changes and restore the A019 stabilization
    baseline.
human_gate:
  required: true
  approver: Human Owner
tool_budget:
  search: 10
  read: 50
  write: 25
  execute: 25
  max_runtime_minutes: 180
