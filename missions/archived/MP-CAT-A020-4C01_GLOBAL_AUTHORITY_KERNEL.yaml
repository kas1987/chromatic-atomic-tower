mission_id: MP-CAT-A020-4C01
title: CAT Global Authority Kernel and Cross-Repo Contract
level: M4
status: approved
owner: Human Owner
priority: 1
risk_level: high
reversibility: high
autonomy_level: L2
confidence_minimum: 92
created: '2026-08-08'
objective: Make CAT the sole global mission and governance authority while exposing
  a bounded, portable execution contract to Harness V2 and future repositories.
background: 'A019 established the CAT repository baseline and dispositioned PR #47
  for supersession. A020 formalizes the authority boundary before implementation expands
  across repositories.'
dependencies:
- MP-CAT-A019-4C01
scope:
  in:
  - Authority ownership contract
  - Portable adapter contract and versioning
  - Cross-repo mutation and evidence gates
  - Derived-state ownership rules
  - Contract tests and migration documentation
  out:
  - Importing V2 runtime topology into CAT
  - Rebuilding V2 routing or observability in CAT
  - Visual control-plane implementation
  - Automatic merge autonomy
