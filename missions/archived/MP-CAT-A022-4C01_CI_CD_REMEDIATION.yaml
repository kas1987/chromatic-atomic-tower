objective: 'Remediate CAT CI/CD control-plane drift and establish deterministic None, Balanced, and Strict cost-guard tiers.'
background: 'The 2026-08-10 audit found eight workflow files, 17 strict cost-guard warnings, stale mission and branch references, duplicated full-test work, weak remote enforcement, an environment-owned hook, and incomplete dynamic-workflow provenance.'
scope:
  in:
  - 'Define and test deterministic cost-guard tier behavior.'
  - 'Integrate the guard into CI and emit exact-head evidence.'
  - 'Harden local workflows and canonicalize stale CI references.'
  - 'Reduce duplicated CI and preserve LOGHOUSE telemetry.'
  - 'Version local hook logic and document dynamic GitHub workflow ownership.'
  - 'Prepare, but do not apply, the remote branch-protection remediation.'
  out:
  - 'Provider-plan changes, subscription overages, or model-routing changes.'
  - 'Secret, credential, production, or deployment configuration changes.'
  - 'Automatic GitHub branch-protection mutation.'
  - 'Automatic merge, branch write, or PR mutation.'
