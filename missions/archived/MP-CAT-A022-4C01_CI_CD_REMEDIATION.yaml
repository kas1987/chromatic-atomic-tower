acceptance_criteria:
- 'None, Balanced, and Strict produce deterministic, explainable outcomes.'
- 'Strict mode passes all local workflows after hardening.'
- 'Every CI invocation emits exact-head cost-guard evidence.'
- 'Stale references, duplicated assurance, hook opacity, and dynamic workflow ownership gaps are resolved or explicitly accepted.'
- 'Remote branch-protection remediation is prepared for human application but is not mutated automatically.'
required_validation:
- type: local
  command: python scripts/cat_check_repo.py && python scripts/cat_validate.py --all && python scripts/cat_cost_guard.py --check --tier strict
  evidence_path: evidence/reports/ci-cd-remediation/BEAD-08.md
  required: true
- type: test
  command: python -m pytest -q
  evidence_path: evidence/reports/ci-cd-remediation/BEAD-08.md
  required: true
rollback:
  required: true
  plan: 'Restore the prior workflow, guard, documentation, and governance files from the pre-remediation commit while preserving the remediation evidence report.'
evidence_requirements:
- exact HEAD and policy version for each tier evaluation
- targeted tier test output
- strict-mode workflow hardening output
- CI artifact and stale-reference reconciliation output
- final full-suite output and residual remote-policy statement
human_gate:
  required: true
  approver: Human Owner
tool_budget:
  search: 40
  read: 120
  write: 80
  execute: 80
  max_runtime_minutes: 360
stop_conditions:
- 'A change requires a forbidden path.'
- 'A secret, credential, production, or deployment path appears.'
- 'A tier outcome cannot be reproduced from the versioned policy and exact workflow source.'
- 'Remote GitHub policy conflicts with the local evidence in an unexplained way.'
- 'Confidence falls below 90.'
