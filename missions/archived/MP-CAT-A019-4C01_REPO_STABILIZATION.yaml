evidence_requirements:
- PR disposition report
- Review-thread disposition report
- Worktree and branch inventory
- Baseline and rollback SHA
- CAT validation and tower-guard outputs
stop_conditions:
- Any unpushed commit would be destroyed.
- Any dirty worktree lacks an owner/disposition.
- A source-of-truth conflict cannot be resolved from governance hierarchy.
- Required validation cannot run.
- Human approval is required for a destructive cleanup action.
