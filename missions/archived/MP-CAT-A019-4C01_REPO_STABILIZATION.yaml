- docs/operations/MP-CAT-A019/**
- CAT_ROADMAP.md
- CHROMATIC_TREES.md
forbidden_paths:
- .env
- .env.*
- secrets/**
- credentials/**
- '**/*.key'
- agents/registry/AGENT_SCORECARD.yaml
- learnings/**
dependencies: []
acceptance_criteria:
- PR 47 has an evidence-backed merge, close, or supersede disposition.
- No unresolved P0/P1 review finding remains on any PR selected for merge.
- Local worktrees, branches, stashes, dirty files, and unpushed commits are inventoried.
- Canonical mission registry and tower state agree.
- A rollback SHA/reference is recorded before destructive cleanup.
- CAT validation and tower-guard evidence is recorded.
required_validation:
- type: cat_validate
  command: python scripts/cat_validate.py --all
  evidence_path: evidence/reports/MP-CAT-A019_validate.txt
  required: true
- type: tower_guard
  command: python scripts/cat_tower_guard.py --write-report
  evidence_path: evidence/reports/MP-CAT-A019_tower_guard.md
  required: true
rollback:
  required: true
  plan: Restore the recorded baseline SHA/backup branch and revert only A019 cleanup
    changes.
human_gate:
  required: true
  approver: Human Owner
tool_budget:
  search: 8
  read: 40
  write: 20
  execute: 20
  max_runtime_minutes: 180
