objective: Establish a clean, auditable CAT repository baseline before any cross-repo
  authority redesign or implementation.
background: 'CAT is the proposed global governance kernel. Remote review found PR
  #47 open with unresolved review threads and prior evidence of state-document drift.'
scope:
  in:
  - Open PR and unresolved review-thread disposition
  - Local branch, worktree, stash, dirty-state and unpushed-commit inventory
  - Mission registry, tower state, roadmap and current-state reconciliation
  - Rollback checkpoint and stabilization signoff
  out:
  - Cross-repo authority implementation
  - Automatic merge or destructive cleanup
  - Secret or credential mutation
allowed_paths:
- missions/active/MP-CAT-A019-4C01_REPO_STABILIZATION.yaml
- missions/registry/MISSION_REGISTRY.yaml
- beads/active/BEAD-CAT-A019-4C01-*.yaml
