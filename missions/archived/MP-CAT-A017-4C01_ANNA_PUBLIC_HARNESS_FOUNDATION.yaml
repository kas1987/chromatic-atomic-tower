created: '2026-08-03'
last_updated: '2026-08-03T14:10:10+00:00'
objective: Establish the public ANNA harness contract and a safe local scaffold that
  can inspect and govern private DataAnn projects without publishing private content.
background: ANNA is the public control plane for projects, apps, tools, and future
  DataAnnotation work. It must reuse structural lessons from Governance, CAT, and
  Chromatic Harness v2 while keeping private DataAnn artifacts and local estate data
  outside the public repository.
scope:
  in:
  - Public repository contract and synthetic-only boundary
  - Mission, evidence, and control-plane directory conventions
  - Deterministic local validation and CI skeleton
  - Read-only connection contract for future DataAnn adapters
  out:
  - Copying DataAnn tasks, submissions, or private prompts
  - Publishing _RealWorld, _Gemini Files, local logs, or credentials
  - Automatic cross-repository mutation, merge, or release
  - Live provider credentials or production deployment
allowed_paths:
- missions/active/MP-CAT-A017-4C01_ANNA_PUBLIC_HARNESS_FOUNDATION.yaml
- beads/active/BEAD-CAT-A017-4C01-01_ESTABLISH_ANNA_PUBLIC_CONTRACT_AND_LOCAL_SCAFFOLD.yaml
- missions/registry/MISSION_REGISTRY.yaml
- state/TOWER_STATE.yaml
- external://C:/.101_ANNA/**
forbidden_paths:
- .env
- secrets/**
- external://C:/.10_DataAnn/_PerGPT/da-accounting-tasks/submissions/**
- external://C:/.10_DataAnn/_RealWorld/**
- external://C:/.10_DataAnn/_Gemini Files/**
- external://C:/.10_DataAnn/07_LOGS_AND_AUDIT/**
dependencies: []
acceptance_criteria:
- ANNA has a public-safe root contract, README, license, ignore rules, and tree map.
- ANNA has a machine-readable project boundary and deterministic repository smoke
  test.
- The contract names DataAnn as a private adapter target without embedding private
  task content.
- CI runs the public-boundary and repository smoke checks without network credentials.
success_metrics:
- A clean checkout can run the contract gate offline.
- A fixture containing private/real-world path names is rejected while synthetic fixtures
  pass.
- No files under the private DataAnn, _RealWorld, _Gemini Files, or local-log roots
  are copied into ANNA.
required_validation:
- type: self_review
  command: python -m pytest -q tests/test_repo_contract.py
  evidence_path: evidence/reports/MP-CAT-A017-4C01-01_contract.md
  required: true
- type: content_boundary
  command: python tools/anna_public_boundary.py --check
  evidence_path: evidence/reports/MP-CAT-A017-4C01-01_boundary.json
  required: true
rollback:
