bead_id: BEAD-CAT-A020-4C01-03
mission_id: MP-CAT-A020-4C01
title: Implement cross-repo mutation gate
status: queued
priority: 1
agent_role: Sentinel
autonomy_level: L2
objective: Reject cross-repo mutation requests without complete CAT trace and permit only explicit target paths.
allowed_paths:
  - schemas/cross_repo_mutation.schema.json
  - scripts/cat_cross_repo_gate.py
  - tests/test_cross_repo_mutation_gate.py
  - evidence/a020/**
  - evidence/reports/MP-CAT-A020_mutation_gate_*.txt
forbidden_paths:
  - .env
  - .env.*
  - secrets/**
  - credentials/**
  - '**/*.key'
  - agents/registry/AGENT_SCORECARD.yaml
  - learnings/**
dependencies:
  - BEAD-CAT-A020-4C01-02
tool_budget:
  search: 10
  read: 50
  write: 20
  execute: 20
  max_runtime_minutes: 120
confidence:
  minimum: 92
  current: 92
  objective_clarity: 94
  scope_clarity: 92
  evidence_quality: 92
  reversibility: 94
  tool_fit: 92
  risk_awareness: 97
  testability: 94
risk_level: high
reversibility: high
stop_conditions:
  - A request can mutate without Mission ID, BEAD ID, or allowed paths.
  - The gate relies on V2 internals.
  - Validation cannot run.
definition_of_done:
  - Unauthorized mutation is rejected.
  - Authorized bounded mutation produces evidence.
validation:
  - type: targeted_test
    command: python -m pytest tests/test_cross_repo_mutation_gate.py -q
    evidence_path: evidence/reports/MP-CAT-A020_mutation_gate_validation.txt
    required: true
required_output:
  - mutation_gate
handoff:
  from: Sentinel
  to: Sentinel
  reviewer: Human Owner
  next_bead_id: BEAD-CAT-A020-4C01-04
