bead_id: BEAD-CAT-A027-4C01-02
mission_id: MP-CAT-A027-4C01
title: Harden local GitHub App helper contract
status: queued
agent_role: Builder
autonomy_level: L2
priority: 2
objective: >-
  Make the existing App-token helper safely auditable with redacted diagnostics,
  explicit repository/installation binding, least-privilege documentation, and
  fixture-only tests; it must never print tokens or create credentials.
allowed_paths:
  - scripts/github_app_token.py
  - scripts/gh_app_token.sh
  - .env.example
  - tests/test_github_app_token.py
  - docs/operations/GITHUB_APP_ACCESS_RUNBOOK.md
  - evidence/reports/github-pro-governance/BEAD-02.md
forbidden_paths: [.env, .github_app_token_cache, '*.pem', secrets/**, credentials/**, GitHub settings, installations, branches, PRs, or rulesets]
dependencies: [BEAD-CAT-A027-4C01-01]
tool_budget: {search: 20, read: 60, write: 30, execute: 30, max_runtime_minutes: 120}
confidence: {minimum: 90, current: 90, objective_clarity: 94, scope_clarity: 92, evidence_quality: 86, reversibility: 96, tool_fit: 94, risk_awareness: 98, testability: 96}
risk_level: high
reversibility: high
stop_conditions: [A live credential is needed, helper can target an unbound repository, or confidence drops below 90.]
definition_of_done: [Fixture tests prove redaction and fail-closed missing configuration, no credential-like output exists, exact-head evidence is recorded.]
validation:
  - type: test
    command: python -m pytest -q tests/test_github_app_token.py
    evidence_path: evidence/reports/github-pro-governance/BEAD-02.md
    required: true
required_output: [redaction_contract, fixture_results, evidence_path]
handoff: {next_bead_id: BEAD-CAT-A027-4C01-03, notes: Helper remains read-only and secret-free.}
