  - missions/registry/MISSION_REGISTRY.yaml
  - beads/active/BEAD-CAT-A024-4C01-05.yaml
  - beads/completed/BEAD-CAT-A024-4C01-05.yaml
  - state/TOWER_STATE.yaml
  - evidence/reports/taxonomy/**
